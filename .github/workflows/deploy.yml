- name: Install and configure Koyeb CLI
  uses: koyeb-community/koyeb-actions@v2
  with:
    api_token: "${{ secrets.KOYEB_API_TOKEN }}"

# (Optional but recommended) Create/update Koyeb secrets from GitHub Secrets
- name: Create Koyeb secret - SPRING_DATASOURCE_URL
  uses: koyeb/action-git-deploy/secret@v1
  with:
    secret-name: SPRING_DATASOURCE_URL
    secret-value: "${{ secrets.SPRING_DATASOURCE_URL }}"

- name: Create Koyeb secret - SPRING_DATASOURCE_USERNAME
  uses: koyeb/action-git-deploy/secret@v1
  with:
    secret-name: SPRING_DATASOURCE_USERNAME
    secret-value: "${{ secrets.SPRING_DATASOURCE_USERNAME }}"

- name: Create Koyeb secret - SPRING_DATASOURCE_PASSWORD
  uses: koyeb/action-git-deploy/secret@v1
  with:
    secret-name: SPRING_DATASOURCE_PASSWORD
    secret-value: "${{ secrets.SPRING_DATASOURCE_PASSWORD }}"

# One-time cleanup: ensure FRA is removed before the action updates the service
- name: Remove FRA region if present (one-time fix)
  run: koyeb service update fit-maisie/snake-leaderboard-backend --region '!fra'

- name: Build and deploy to Koyeb
  uses: koyeb/action-git-deploy@v1
  with:
    app-name: fit-maisie
    service-name: snake-leaderboard-backend

    # ✅ THIS is the correct input name
    service-regions: na

    service-ports: "8080:http"
    service-routes: "/:8080"
    service-checks: "8080:http:/health"

    service-env: >-
      PORT=8080,SPRING_DATASOURCE_URL=@SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME=@SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD=@SPRING_DATASOURCE_PASSWORD
