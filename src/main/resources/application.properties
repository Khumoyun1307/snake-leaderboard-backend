spring.application.name=snake-leaderboard-api
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snakeleaderboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:snakeuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:snakepass}

spring.flyway.enabled=true

# Let Flyway manage schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
