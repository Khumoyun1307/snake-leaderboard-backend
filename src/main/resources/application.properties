spring.application.name=snake-leaderboard-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/snakeleaderboard
spring.datasource.username=snakeuser
spring.datasource.password=snakepass

spring.flyway.enabled=true

# Let Flyway manage schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
